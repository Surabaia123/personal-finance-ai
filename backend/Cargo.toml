[package]
name = "personal-finance-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
argon2 = "0.5"
ulid = "1"

jsonwebtoken = "9"
chrono = "0.4"